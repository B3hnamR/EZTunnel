[package]
name = "eztunnel"
version = "0.9.14"
edition = "2024"
rust-version = "1.88"
description = "Independent encrypted reverse tunnel with locally pinned peer keys"
license = "AGPL-3.0-only"

[features]
default = ["browser-tls"]
# A TLS client that looks like Chrome (`tls_profile: "chrome"`), built on BoringSSL. Building it needs
# cmake and a C++ compiler; `cargo build --no-default-features` leaves it out.
browser-tls = ["dep:boring", "dep:tokio-boring", "dep:p256", "dep:brotli-decompressor"]

[dependencies]
anyhow = "1"
boring = { version = "5", optional = true, features = ["mlkem", "mldsa"] }
tokio-boring = { version = "5", optional = true }
p256 = { version = "0.13", optional = true, default-features = false, features = ["arithmetic", "pkcs8", "alloc"] }
brotli-decompressor = { version = "4", optional = true }
base64 = "0.22"
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = { version = "0.12", default-features = false }
hex = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
rcgen = "0.13"
sha2 = "0.10"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
tokio_kcp = { version = "0.9.8", path = "vendor/tokio_kcp" }
webpki-roots = "1"
# Official release-file authentication; never required for executing a local build.
ed25519-dalek = { version = "2", default-features = false, features = ["fast", "std", "zeroize", "rand_core"] }
blake3 = { version = "1", features = ["no_neon"] }
hkdf = { version = "0.12" }
hmac = "0.12"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
snow = { version = "0.10", default-features = false, features = ["use-chacha20poly1305", "use-blake2", "use-curve25519", "use-getrandom", "risky-raw-split"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

# The static (musl) build uses mimalloc: musl's own allocator is several times slower for the many small
# buffers per packet, which halved the speed of the KCP and FEC carriers.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3"
# The vendored KCP core, tested directly (tests/kcp_burst.rs).
kcp = { version = "0.5.3", path = "vendor/kcp" }
# Mocked time (tokio::time::advance) for the FEC pacer's tests; unions with the main
# dependency's features, so this adds nothing to a release build.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true

# Distribution optimization; tests retain unwind under the release profile.
[profile.dist]
inherits = "release"
lto = true
panic = "abort"
codegen-units = 1
